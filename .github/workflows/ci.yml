# CI for the POS backend.
#
# `mvn verify` runs the unit tests always; the Testcontainers MySQL
# integration tests detect Docker on the runner (GitHub's ubuntu runners have
# it) and run for real there, exactly as they skip gracefully on a Docker-less
# laptop. The build proves the same thing a release build must: it compiles,
# the tests pass, and the jar packages.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # The shops and the production server run on Sri Lankan time, and the
  # business-date logic follows the JVM clock. A UTC runner books an offline
  # sale pushed after 05:30 onto the previous day and the offline-sales test
  # rightly fails - CI runs on the clock production runs on.
  TZ: Asia/Colombo

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B verify
