spring.application.name=pos-backend

# Activate the 'dev' profile by default when no explicit profile is set.
# In production, override this with: --spring.profiles.active=prod
# (or set the env var SPRING_PROFILES_ACTIVE=prod in your deployment)
spring.profiles.default=dev

# Multi-tenancy: name of the legacy shared database (fallback for un-migrated tenants)
app.datasource.legacy-db=${LEGACY_DB:pos_db}
# Multi-tenancy: SaaS control-plane database
app.datasource.master-db=${MASTER_DB:pos_master}
app.tenant.allow-legacy-fallback=${TENANT_ALLOW_LEGACY_FALLBACK:true}
# Phase 4 guard: keep disabled until tenant baseline + onboardShop wiring are ready
app.tenant.provisioning.enabled=${TENANT_PROVISIONING_ENABLED:true}
# Disable Spring Boot auto-Flyway; we run it programmatically per catalog
spring.flyway.enabled=false
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
# SECURITY: show-sql must be false in production (leaks query structure to logs)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Colombo
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo
# SECURITY: do NOT log security debug in production — set to WARN via env
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# Connection pool tuning (HikariCP defaults)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFE_MS:1800000}

# JWT — NO hardcoded default; app will fail to start if secret is missing or too short
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
# Super-admin bootstrap — NO hardcoded defaults; must be supplied via env in production
app.bootstrap.super-admin.username=${BOOTSTRAP_SUPER_ADMIN_USERNAME}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD}

# Phase 5 bulk tenant migration. Runner is active only with profile: migrate-tenants.
tenant-migration.dry-run=${TENANT_MIGRATION_DRY_RUN:true}
tenant-migration.batch-size=${TENANT_MIGRATION_BATCH_SIZE:10}
tenant-migration.tenants=${TENANT_MIGRATION_TENANTS:}

# MISS-09: Swagger / OpenAPI (disable in production via env var)
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# MISS-10: Actuator health endpoint config
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when_authorized}
management.endpoint.caches.enabled=true

# Durable report export lifecycle. Use REPORT_EXPORT_STORAGE=s3 in production.
app.report-exports.storage=${REPORT_EXPORT_STORAGE:local}
app.report-exports.directory=${REPORT_EXPORT_DIRECTORY:report-exports}
app.report-exports.poll-delay-ms=${REPORT_EXPORT_POLL_DELAY_MS:5000}
app.report-exports.max-attempts=${REPORT_EXPORT_MAX_ATTEMPTS:3}
app.report-exports.retry-delay-seconds=${REPORT_EXPORT_RETRY_DELAY_SECONDS:60}
app.report-exports.stale-after-minutes=${REPORT_EXPORT_STALE_MINUTES:30}
app.report-exports.retention-days=${REPORT_EXPORT_RETENTION_DAYS:30}
app.report-exports.forecast-snapshot-retention-days=${FORECAST_SNAPSHOT_RETENTION_DAYS:365}
app.report-exports.cleanup-cron=${REPORT_EXPORT_CLEANUP_CRON:0 30 2 * * *}
app.report-exports.email.enabled=${REPORT_EXPORT_EMAIL_ENABLED:false}
app.report-exports.s3.bucket=${REPORT_EXPORT_S3_BUCKET:}
app.report-exports.s3.region=${REPORT_EXPORT_S3_REGION:ap-south-1}
app.report-exports.s3.endpoint=${REPORT_EXPORT_S3_ENDPOINT:}
app.report-exports.s3.access-key=${REPORT_EXPORT_S3_ACCESS_KEY:}
app.report-exports.s3.secret-key=${REPORT_EXPORT_S3_SECRET_KEY:}

# SMTP is only required when REPORT_EXPORT_EMAIL_ENABLED=true.
spring.mail.host=${REPORT_EXPORT_SMTP_HOST:}
spring.mail.port=${REPORT_EXPORT_SMTP_PORT:587}
spring.mail.username=${REPORT_EXPORT_SMTP_USERNAME:}
spring.mail.password=${REPORT_EXPORT_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${REPORT_EXPORT_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${REPORT_EXPORT_SMTP_STARTTLS:true}
