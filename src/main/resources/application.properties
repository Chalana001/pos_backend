spring.application.name=pos-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
logging.level.org.springframework.security=DEBUG

# JWT
app.jwt.secret=${APP_JWT_SECRET:dev-only-jwt-secret-change-in-production-1234567890}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
app.bootstrap.super-admin.username=${BOOTSTRAP_SUPER_ADMIN_USERNAME:super-admin}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:super-admin}
