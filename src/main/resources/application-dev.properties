# ============================================================
# DEV PROFILE ONLY — NEVER USE IN PRODUCTION
# Activate with: --spring.profiles.active=dev
# ============================================================
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG

# Safe dev-only JWT secret (>= 32 chars)
app.jwt.secret=dev-only-jwt-secret-change-in-production-1234567890

# Safe dev-only super-admin credentials
app.bootstrap.super-admin.username=super-admin
app.bootstrap.super-admin.password=super-admin-dev-password-change-me

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
