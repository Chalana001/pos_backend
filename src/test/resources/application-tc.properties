# MySQL datasource, URL/username/password are overridden at runtime by @DynamicPropertySource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/?createDatabaseIfNotExist=true
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.jackson.time-zone=Asia/Colombo
spring.jackson.datatype.datetime.use-time-zone-for-lenient-date-parsing=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

app.datasource.master-db=pos_master
# pos_db really exists in the container (created by the init script every test
# container mounts). It has to: getAnyConnection() anchors raw connections on
# it, and TenantFlywayRunner migrates it with the tenant chain - pointing the
# legacy name at pos_master made that chain run over the master schema.
app.datasource.legacy-db=pos_db
# The suite seeds tenant rows straight into the legacy database and logs in
# with tenant ids that have no tenant_databases registration - the fallback IS
# the routing these tests are built on.
app.tenant.allow-legacy-fallback=true
app.tenant.provisioning.enabled=true

app.bootstrap.super-admin.username=super-admin
app.bootstrap.super-admin.password=super-admin

app.jwt.secret=tc-test-jwt-secret-change-in-production-1234567890
app.jwt.expiration=86400000

logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# The report-export queue is driven explicitly by the tests that care about it
# (reportExportJobScheduler.processTenantNow), so the background @Scheduled poller
# should not also be picking jobs up mid-test. A very long delay leaves the bean
# wired and unit-testable while making the tests the only thing that drives it.
# Note this is hygiene, not the reason the export lifecycle test once failed only
# in a full run. That was sub-millisecond timestamps rounding forward on write;
# see com.chala.posapp.util.StorageClock.
app.report-exports.poll-delay-ms=3600000

# Same reasoning: nothing should expire a trial out from under a test.
app.subscription.trial-sweep-enabled=false

# The container suite is one MockMvc client at one loopback IP, and ApiIntegrationTestSupport
# logs in two users per test method across twenty-plus classes. Production's per-IP auth
# bucket (20/min) and per-account lockout are testing nothing here except arithmetic; left
# on, the suite fails its own logins with 429 once enough tests have run. Tests that need
# the lockout behaviour instantiate LoginAttemptService directly, away from this profile.
app.security.rate-limit.enabled=false
app.security.login.max-attempts=0
